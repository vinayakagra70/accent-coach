<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accent Coach</title>
    <meta name="theme-color" content="#0f0f10" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Live2D Cubism Core: proprietary, put here by setup.ps1 (not in git). Loaded locally so it works offline. -->
    <script src="./live2dcubismcore.min.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">/æ/</span>
        <h1>Accent Coach</h1>
        <p id="tagline">General American for Indian English speakers</p>
      </div>
      <div class="top-controls">
        <button class="btn small" id="retakeTest" title="Take the voice test again and update your course">Voice test</button>
        <label class="seg" title="The accent you're learning">
          <span>Accent</span>
          <select id="accentPick">
            <option value="us">American</option>
            <option value="uk">British</option>
          </select>
        </label>
        <label class="seg" title="Used for the vowel mirror; picks the right reference vowels for your voice">
          <span>My voice</span>
          <select id="voiceType">
            <option value="low">Lower (most men)</option>
            <option value="high">Higher (most women)</option>
          </select>
        </label>
      </div>
    </header>

    <main class="layout">
      <nav class="lessons" id="lessonList" aria-label="Sounds"></nav>

      <section class="stage">
        <div class="viewport" id="viewport"></div>
        <div class="stage-bar">
          <div class="modes" id="modes" role="tablist"></div>
          <div class="stage-right">
            <span class="now" id="nowPlaying" aria-live="polite"></span>
            <button class="ghost-btn" id="viewSide" title="Flat side view">Side</button>
            <button class="ghost-btn" id="view3d" title="3D view">3D</button>
          </div>
        </div>
        <div class="legend">
          <span><i class="dot air"></i>Air</span>
          <span><i class="dot nasal"></i>Air through the nose</span>
          <span><i class="dot buzz"></i>Voice buzzing</span>
          <span><i class="dot touch"></i>Touch here</span>
          <span><i class="dot ghost"></i>Target shape</span>
        </div>
      </section>

      <aside class="panel" id="panel">
        <section class="coach" aria-label="Your coach">
          <div class="coach-stage" id="coachStage"></div>
          <div class="coach-side">
            <p class="coach-name">Nova <span>your coach</span></p>
            <p class="coach-caption" id="coachCaption" aria-live="polite"></p>
            <div class="row" id="coachButtons"></div>
          </div>
        </section>
        <div id="panelBody"></div>
      </aside>
    </main>
    <footer class="creator-credit" aria-label="Creator credit">
      <span>Made by <strong>Vinayak Agrawal</strong></span>
      <a href="https://instagram.com/vinayakk.014" target="_blank" rel="noreferrer">@vinayakk.014</a>
    </footer>
    <div id="overlay" class="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accent Coach</title>
    <meta name="theme-color" content="#0f0f10" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <!-- iOS ignores SVG here, so the PNG stays -->
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Accent Coach" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Live2D Cubism Core: proprietary, put here by setup.ps1 (not in git). Loaded locally so it works offline. -->
    <script src="./live2dcubismcore.min.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">/æ/</span>
        <h1>Accent Coach</h1>
        <p id="tagline">General American for Indian English speakers</p>
      </div>
      <div class="top-controls">
        <button class="btn small" id="helpBtn" title="What to do here: Nova walks you through it" aria-label="Help: show me what to do"><span>Help</span></button>
        <button class="btn small" id="retakeTest" title="Take the voice test again and update your course">Voice test</button>
        <label class="seg" title="The accent you're learning">
          <span>Accent</span>
          <select id="accentPick">
            <option value="us">American</option>
            <option value="uk">British</option>
          </select>
        </label>
        <label class="seg" title="Used for the vowel mirror; picks the right reference vowels for your voice">
          <span>My voice</span>
          <select id="voiceType">
            <option value="low">Lower voice</option>
            <option value="high">Higher voice</option>
          </select>
        </label>
      </div>
    </header>

    <main class="layout">
      <nav class="lessons" id="lessonList" aria-label="Sounds"></nav>

      <section class="stage">
        <div class="viewport" id="viewport"></div>
        <div class="stage-bar">
          <div class="modes" id="modes" role="tablist"></div>
          <div class="stage-right">
            <button class="ghost-btn to-lessons" id="toLessons">Lessons &amp; phrases</button>
            <span class="now" id="nowPlaying" aria-live="polite"></span>
            <button class="ghost-btn" id="viewSide" title="Flat side view">Side</button>
            <button class="ghost-btn" id="view3d" title="3D view">3D</button>
          </div>
        </div>
        <div class="legend">
          <span><i class="dot air"></i>Air</span>
          <span><i class="dot nasal"></i>Air through the nose</span>
          <span><i class="dot buzz"></i>Voice buzzing</span>
          <span><i class="dot touch"></i>Touch here</span>
          <span><i class="dot ghost"></i>Target shape</span>
        </div>
      </section>

      <aside class="panel" id="panel">
        <section class="coach" aria-label="Your coach">
          <div class="coach-stage" id="coachStage"></div>
          <div class="coach-side">
            <p class="coach-name">Nova <span>your coach</span></p>
            <p class="coach-caption" id="coachCaption" aria-live="polite"></p>
            <div class="row" id="coachButtons"></div>
          </div>
        </section>
        <div id="panelBody"></div>
      </aside>
    </main>
    <footer class="creator-credit" aria-label="Creator credit">
      <a class="more-by creator-more" href="https://vinayak-ten-lyart.vercel.app/" target="_blank" rel="noopener noreferrer" title="Vinayak Agrawal's other projects">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
        <span>More by Vinayak</span>
        <span aria-hidden="true">↗</span>
      </a>
      <a class="creator-instagram" href="https://instagram.com/vinayakk.014" target="_blank" rel="noopener noreferrer">
        <span>Follow on Instagram</span>
        <strong>@vinayakk.014</strong>
        <span aria-hidden="true">↗</span>
      </a>
      <a class="creator-github" href="https://github.com/vinayakagra70" target="_blank" rel="noopener noreferrer" aria-label="GitHub: vinayakagra70">

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

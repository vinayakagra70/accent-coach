<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accent Coach</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">◐</span>
        <div>
          <h1>Accent Coach</h1>
          <p>General American for Indian English speakers</p>
        </div>
      </div>
      <div class="top-controls">
        <label class="seg" title="Used for the vowel mirror; picks the right reference vowels for your voice">
          <span>My voice</span>
          <select id="voiceType">
            <option value="low">Lower (most men)</option>
            <option value="high">Higher (most women)</option>
          </select>
        </label>
      </div>
    </header>

    <main class="layout">
      <nav class="lessons" id="lessonList" aria-label="Sounds"></nav>

      <section class="stage">
        <div class="viewport" id="viewport"></div>
        <div class="stage-bar">
          <div class="modes" id="modes" role="tablist"></div>
          <div class="stage-right">
            <span class="now" id="nowPlaying" aria-live="polite"></span>
            <button class="ghost-btn" id="viewSide" title="Flat side view">Side</button>
            <button class="ghost-btn" id="view3d" title="3D view">3D</button>
          </div>
        </div>
        <div class="legend">
          <span><i class="dot air"></i>air</span>
          <span><i class="dot nasal"></i>air through nose</span>
          <span><i class="dot buzz"></i>voice buzzing</span>
          <span><i class="dot touch"></i>touch here</span>
          <span><i class="dot ghost"></i>target shape</span>
        </div>
      </section>

      <aside class="panel" id="panel"></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
